# On a GitHub Release, build the plugin from the tag and attest the artifacts (SLSA provenance).
# Verify with: gh attestation verify main.js -R <owner>/<repo>
#           gh attestation verify styles.css -R <owner>/<repo>
# Docs: https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds

name: Release artifact attestation

on:
    release:
        types: [published]

permissions:
    id-token: write
    contents: write          # write is required to upload assets to the Release
    attestations: write
    artifact-metadata: write

jobs:
    attest-release-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: npm

            - run: npm ci
            - run: npm run build

            # Upload the build output to the Release
            - name: Upload assets to Release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      dist/main.js
                      dist/styles.css
                      dist/manifest.json

            # styles.css / main.js / manifest.json match the usual Release assets; several subjects in one provenance
            - name: Generate build provenance attestation (styles.css, main.js, manifest.json)
              uses: actions/attest@v4
              with:
                  subject-path: "dist/styles.css, dist/main.js, dist/manifest.json"